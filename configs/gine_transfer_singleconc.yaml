# GINE single-concentration pretraining -> full pIC50 fine-tuning (experiment B).
#
# Paired with gine_multitask.yaml, this separates the two explanations for any transfer
# gain: if GINE transfer also beats GINE direct, the benefit is transfer learning; if
# only the D-MPNN improves, the benefit is specific to the directed message-passing
# architecture. Same folds, seeds, targets, losses, and stage structure as the D-MPNN
# transfer configs.
experiment: gine_transfer_singleconc
pretraining_experiment: gine_singleconc_pretrain
finetune_experiment: gine_singleconc_to_pic50
model:
  type: gine
  architecture: cyp_specific_heads
  hidden_dim: 512
  num_layers: 5
  dropout: 0.10
  residual: true
  normalization: layernorm
  pooling: mean
  ffn_hidden_dim: 512
  ffn_num_layers: 3
  ffn_dropout: 0.10
  head_type: mlp
  head_layer_norm: false
data:
  split_scheme: ecfp_cluster
  target_normalization: zscore_per_target
  inner_validation_fold: null
  cyps: [CYP1A2, CYP2C9, CYP2D6, CYP3A4]
featurization:
  policy: fail
pretraining:
  loss_mode: standard
  batch_size: 64
  max_epochs: 100
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  early_stopping_patience: 15
  gradient_clip_norm: 5.0
  num_workers: 0
  selection_metric: macro_MAE
  metric_direction: minimize
  precision: auto
  scheduler: none
  initial_epoch_estimate_seconds: 420
  runtime_safety_margin_seconds: 60
transfer:
  mode: full
  require_fold_safe_auxiliary: true
  initialize_encoder_from_pretraining: true
  reset_output_heads: true
  encoder_learning_rate: 1.0e-4
  head_learning_rate: 1.0e-3
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 15
  gradient_clip_norm: 5.0
  weight_decay: 1.0e-5
  freeze_encoder_epochs: 10
  num_workers: 0
  selection_metric: macro_ST_RAE
  metric_direction: minimize
  precision: auto
  scheduler: none
  initial_epoch_estimate_seconds: 420
  runtime_safety_margin_seconds: 60
  endpoint_refinement:
    enabled: false
    encoder_mode: frozen
    learning_rate: 1.0e-4
    epochs: 20
loss:
  loss_mode: interval_aware
  weight_clip_min: 0.2
  weight_clip_max: 5.0
reproducibility:
  deterministic: true
