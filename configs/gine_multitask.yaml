# GINE direct masked-multitask baseline (experiment A of the architecture comparison).
# Runs through the same scripts/train_multitask.py as the D-MPNN; only model.type differs.
experiment: gine_multitask_direct
model:
  type: gine
  architecture: cyp_specific_heads
  hidden_dim: 512
  num_layers: 5
  dropout: 0.10
  residual: true
  normalization: layernorm
  pooling: mean
  ffn_hidden_dim: 512
  ffn_num_layers: 3
  ffn_dropout: 0.10
  head_type: mlp
  head_layer_norm: false
data:
  split_scheme: ecfp_cluster
  target_normalization: zscore_per_target
  cyps: [CYP1A2, CYP2C9, CYP2D6, CYP3A4]
featurization:
  policy: fail
training:
  batch_size: 64
  max_epochs: 100
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  early_stopping_patience: 15
  gradient_clip_norm: 5.0
  num_workers: 0
  selection_metric: macro_ST_RAE
  metric_direction: minimize
  precision: auto
  scheduler: none
  initial_epoch_estimate_seconds: 420
  runtime_safety_margin_seconds: 60
loss:
  loss_mode: interval_aware
  weight_clip_min: 0.2
  weight_clip_max: 5.0
reproducibility:
  deterministic: true
