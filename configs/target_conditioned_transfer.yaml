# Target-conditioned D-MPNN transfer: f(molecule_embedding, CYP_embedding) -> pIC50.
#
# The encoder is identical to the cyp_specific_heads transfer configuration, so the only
# change is how the four endpoints are produced: one shared predictor conditioned on a
# learned CYP embedding instead of four independent heads. Encoder checkpoints are
# interchangeable with the cyp_specific_heads runs because only encoder hyperparameters
# are compared during transfer validation.
experiment: target_conditioned_transfer
pretraining_experiment: target_conditioned_pretrain
finetune_experiment: target_conditioned_to_pic50
model:
  type: dmpnn
  architecture: target_conditioned
  message_hidden_dim: 600
  message_passing_depth: 4
  dropout: 0.10
  aggregation: mean
  cyp_embedding_dim: 32
  predictor_hidden_dim: 600
  predictor_layers: 3
  ffn_dropout: 0.10
  head_type: mlp
  head_layer_norm: false
data:
  split_scheme: ecfp_cluster
  target_normalization: zscore_per_target
  inner_validation_fold: null
  cyps: [CYP1A2, CYP2C9, CYP2D6, CYP3A4]
featurization:
  policy: fail
pretraining:
  loss_mode: standard
  batch_size: 64
  max_epochs: 100
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  early_stopping_patience: 15
  gradient_clip_norm: 5.0
  num_workers: 0
  selection_metric: macro_MAE
  metric_direction: minimize
  precision: auto
  scheduler: none
  initial_epoch_estimate_seconds: 420
  runtime_safety_margin_seconds: 60
transfer:
  mode: full
  require_fold_safe_auxiliary: true
  initialize_encoder_from_pretraining: true
  reset_output_heads: true
  encoder_learning_rate: 1.0e-4
  head_learning_rate: 1.0e-3
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 15
  gradient_clip_norm: 5.0
  weight_decay: 1.0e-5
  freeze_encoder_epochs: 10
  num_workers: 0
  selection_metric: macro_ST_RAE
  metric_direction: minimize
  precision: auto
  scheduler: none
  initial_epoch_estimate_seconds: 420
  runtime_safety_margin_seconds: 60
  endpoint_refinement:
    enabled: false
    encoder_mode: frozen
    learning_rate: 1.0e-4
    epochs: 20
loss:
  loss_mode: interval_aware
  weight_clip_min: 0.2
  weight_clip_max: 5.0
reproducibility:
  deterministic: true
