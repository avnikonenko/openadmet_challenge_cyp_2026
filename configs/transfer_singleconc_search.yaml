      model.ffn_hidden_dim: 600
      transfer.head_learning_rate: 3.0e-4
  - name: h600_d4_bs128
    checkpoint_run_name: pre_h600_d4_ffn600_drop010_mlp
    overrides:
      model.message_hidden_dim: 600
