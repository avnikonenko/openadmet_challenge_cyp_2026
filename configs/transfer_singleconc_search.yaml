  - name: h600_d4_residual_head
    checkpoint_run_name: pre_h600_d4_ffn600_drop010_residual
    overrides:
      model.message_hidden_dim: 600
      model.message_passing_depth: 4
      model.ffn_hidden_dim: 600
      model.ffn_num_layers: 3
      model.head_type: residual_mlp
  - name: h1024_d5_bs128
    checkpoint_run_name: pre_h1024_d5_ffn600_drop020_mlp
    overrides:
      model.message_hidden_dim: 1024
