experiment: chemprop_multitask_direct
model:
  type: dmpnn
  message_hidden_dim: 300
  message_passing_depth: 3
  dropout: 0.10
  aggregation: mean
  ffn_hidden_dim: 300
  ffn_num_layers: 2
  ffn_dropout: 0.10
data:
  split_scheme: ecfp_cluster
  target_normalization: zscore_per_target
  cyps: [CYP1A2, CYP2C9, CYP2D6, CYP3A4]
featurization:
  policy: fail
training:
  batch_size: 64
  max_epochs: 100
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  early_stopping_patience: 15
  gradient_clip_norm: 5.0
  num_workers: 0
  selection_metric: macro_ST_RAE
  metric_direction: minimize
  precision: auto
  scheduler: none
  initial_epoch_estimate_seconds: 300
  runtime_safety_margin_seconds: 60
loss:
  loss_mode: standard
  weight_clip_min: 0.2
  weight_clip_max: 5.0
search_grid:
  model.message_hidden_dim: [300, 600]
  model.message_passing_depth: [3, 4]
  model.dropout: [0.05, 0.10, 0.20]
  training.encoder_learning_rate: [1.0e-4, 3.0e-4]
  training.head_learning_rate: [1.0e-3]
  training.batch_size: [32, 64, 128]
reproducibility:
  deterministic: true
